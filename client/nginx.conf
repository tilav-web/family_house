server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # React Router — barcha yo'llarni index.html ga yo'naltirish
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static fayllar keshi (JS, CSS — hashed filenames)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rasmlar va shriftlar keshi
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt, sitemap.xml — qisqa kesh
    location ~* \.(txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
