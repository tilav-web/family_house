# ============================================
# NOTE: gzip on; and server_tokens off; are configured globally in
# /etc/nginx/nginx.conf (http block). Do not duplicate them here.
# SSL blocks are managed by Certbot — do not hand-edit the "listen 443"
# or redirect server blocks unless you know what you're doing.
# ============================================

# ============================================
# hotel-familyhouse.uz — Frontend + API proxy (HTTPS)
# ============================================
server {
    server_name hotel-familyhouse.uz www.hotel-familyhouse.uz;

    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Frontend — build qilingan static fayllar
    root /var/www/family_house/client/dist;
    index index.html;

    # API — Docker dagi backend ga proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Uploads — Docker dagi backend dan
    # `^~` ensures this prefix wins over the static-asset regex below
    # (otherwise /uploads/*.jpg would hit the file-extension regex
    # and nginx would try to serve from root/uploads/... → 404).
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
    }

    # Deny hidden dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # React Router — SPA uchun
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static fayllar keshi
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hotel-familyhouse.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hotel-familyhouse.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================
# api.hotel-familyhouse.uz — Backend API (HTTPS)
# ============================================
server {
    server_name api.hotel-familyhouse.uz;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hotel-familyhouse.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hotel-familyhouse.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================
# HTTP -> HTTPS redirects (managed by Certbot)
# ============================================
server {
    if ($host = www.hotel-familyhouse.uz) {
        return 301 https://$host$request_uri;
    }
    if ($host = hotel-familyhouse.uz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name hotel-familyhouse.uz www.hotel-familyhouse.uz;
    return 404;
}

server {
    if ($host = api.hotel-familyhouse.uz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.hotel-familyhouse.uz;
    return 404;
}
